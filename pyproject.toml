[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "jeam"
version = "0.1.0"
description = "Evidence accumulation models of continuous judgments"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Amir Hosein Hadian Rasanan", email = "amir.h.hadian@gmail.com" }
]

keywords = [
    "evidence accumulation",
    "diffusion models",
    "decision making",
    "cognitive modeling",
    "continuous response",
    "evidence accumulation models",
    "judgment",
    "response time",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering"
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "numba>=0.58",
    "pandas>=2.0",
    "mpmath>=1.3"
]

[project.optional-dependencies]
jax = [
    "jax>=0.4.31"
]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "jax>=0.4.31"
]

docs = [
    "mkdocs",
    "mkdocs-jupyter",
    "mkdocs-material",
    "mkdocs-mermaid2-plugin",
    "mkdocstrings[python]",
    "pymdown-extensions"
]

[dependency-groups]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "jax>=0.4.31"
]
lint = [
    "ruff>=0.16.3,<0.17"
]
notebook = [
    "marimo"
]
docs = [
    "mkdocs",
    "mkdocs-jupyter",
    "mkdocs-material",
    "mkdocs-mermaid2-plugin",
    "mkdocstrings[python]",
    "pymdown-extensions"
]
dev = [
    { include-group = "test" },
    { include-group = "lint" }
]

[project.urls]
Homepage = "https://github.com/AmirHoseinHadian/JEAM"
Documentation = "https://amirhoseinhadian.github.io/JEAM/"
Repository = "https://github.com/AmirHoseinHadian/JEAM"
Issues = "https://github.com/AmirHoseinHadian/JEAM/issues"

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
jeam = ["data/*.csv"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra"
]
testpaths = ["tests"]
markers = [
    "slow: numerical or recovery tests excluded from the default fast suite"
]

[tool.coverage.run]
branch = true
source = ["jeam"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["docs/notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/jeam/Models/*.py" = ["E731", "F401", "I001"]
"src/jeam/__init__.py" = ["F401", "F403", "F405", "I001"]
"src/jeam/utility/*.py" = ["I001"]

[tool.ruff.format]
# The scientific implementation predates Ruff and would produce a review-obscuring
# mechanical diff. New files are formatted now; legacy modules are migrated in focused PRs.
exclude = [
    "docs/notebooks/*.ipynb",
    "docs/tutorials/**/*",
    "src/jeam/Models/**/*",
    "src/jeam/__init__.py",
    "src/jeam/utility/**/*"
]
